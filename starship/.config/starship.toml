palette = "gruvbox_material"

[directory]
style = "bold lavender"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[git_branch]
style = "bold mauve"

[git_status]
style = "bold red"

[cmd_duration]
style = "bold peach"

[username]
style_user = "bold blue"
style_root = "bold red"

[hostname]
style = "bold green"

[time]
style = "bold sapphire"

