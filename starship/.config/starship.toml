palette = "gruvbox_material"

[directory]
style = "bold grey2"

[git_branch]
style = "bold purple"

[cmd_duration]
style = "bold orange"

[username]
style_user = "bold blue"

[hostname]
style = "bold green"

# Gruvbox Material. Styles elsewhere that use these names (the prompt character in green
# and red, git status in red) pick them up from here too.
[palettes.gruvbox_material]
red = "#ea6962"
orange = "#e78a4e"
green = "#a9b665"
blue = "#7daea3"
purple = "#d3869b"
grey2 = "#a89984"
