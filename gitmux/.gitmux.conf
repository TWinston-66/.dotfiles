tmux:
  symbols:
    branch: " "
    hashprefix: ":"
    ahead: "↑·"
    behind: "↓·"
    staged: "● "
    conflict: " "
    modified: "✚ "
    untracked: "… "
    stashed: "⚑ "
    clean: ""
  styles:
    clear: "#[fg=#d4be98]"
    state: "#[fg=#ea6962,bold]"
    branch: "#[fg=#d4be98,bold]"
    remote: "#[fg=#89b482]"
    divergence: "#[fg=#d4be98]"
    staged: "#[fg=#a9b665,bold]"
    conflict: "#[fg=#ea6962,bold]"
    modified: "#[fg=#d8a657,bold]"
    untracked: "#[fg=#d3869b,bold]"
    stashed: "#[fg=#7daea3,bold]"
    clean: "#[fg=#dea473,bold]"
    insertions: "#[fg=#a9b665]"
    deletions: "#[fg=#ea6962]"
  layout: [branch, divergence, flags]
  options:
    branch_max_len: 24
