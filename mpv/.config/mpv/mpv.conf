# Decode on the GPU's video block where there is one: Intel's media driver on the Dell, and
# the Apple Video Decoder through lattice's libva-v4l2-request on the Mac (hosts/mac). mpv's
# default is no hardware decoding at all. auto-safe only picks the hwdec backends mpv
# considers reliable and falls back to software for anything they reject.
hwdec=auto-safe
