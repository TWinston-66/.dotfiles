bind -N "Reload tmux config" r source-file "~/.config/tmux/tmux.conf" \; display "reloaded"

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:usstyle:extkeys:hyperlinks:sync:clipboard"
set -as terminal-features ",foot*:RGB:usstyle:extkeys:hyperlinks:sync:clipboard"

set -s escape-time 10
set -g mouse on
set -g history-limit 50000
set -g display-time 4000
set -g allow-passthrough all
set -g focus-events on
set -s extended-keys on
set -g extended-keys-format csi-u
setw -g aggressive-resize on
set -g status-interval 5

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g set-titles on
set -g set-titles-string "#S: #{b:pane_current_path}"

set -g mouse on
set -g set-clipboard on
# The mouse only selects; nothing is copied until it is asked for, with y, Enter or a right
# click, which then leave copy mode. A drag left alone stays selected, and a click clears it.
unbind -T copy-mode MouseDragEnd1Pane
bind -T copy-mode DoubleClick1Pane select-pane \; send -X select-word
bind -T copy-mode TripleClick1Pane select-pane \; send -X select-line
bind -T root DoubleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H ; send -X select-word }
bind -T root TripleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H ; send -X select-line }
bind -T copy-mode y send -X copy-pipe-and-cancel
bind -T copy-mode Enter send -X copy-pipe-and-cancel
bind -T copy-mode MouseDown3Pane if -F "#{selection_present}" { send -X copy-pipe-and-cancel }
# The terminal hands the wheel to tmux, so this is the scroll speed: 30 lines an event, six
# times tmux's default of 5, as lattice's tmux.conf has it.
bind -T copy-mode WheelUpPane select-pane \; send -X -N 30 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send -X -N 30 scroll-down
bind -T copy-mode-vi WheelUpPane select-pane \; send -X -N 30 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N 30 scroll-down

unbind %
unbind '"'
bind -N "Split side by side" '\' split-window -h -c "#{pane_current_path}"
bind -N "Split top and bottom" - split-window -v -c "#{pane_current_path}"
bind -N "New window" c new-window -c "#{pane_current_path}"

bind -N "Session picker (sesh)" o display-popup -h 60% -w 60% -E "sesh picker -i"
set -g detach-on-destroy off

# The server outlives the compositor, and often starts before it: panes otherwise miss
# HYPRLAND_INSTANCE_SIGNATURE entirely, or keep a stale one across a Hyprland restart, and
# hyprctl then fails with "HYPRLAND_INSTANCE_SIGNATURE not set!". Refreshed from the
# attaching client, so new panes get whichever instance is live. Unset on macOS, no-op there.
set -ga update-environment HYPRLAND_INSTANCE_SIGNATURE

set-environment -g TMUX_FZF_LAUNCH_KEY "f"
set-environment -g TMUX_FZF_OPTIONS "-p -w 60% -h 60% -m"

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

set -g @catppuccin_flavor 'mocha'

set -g @catppuccin_status_background 'none'

set -g @catppuccin_status_connect_separator 'no'
set -g @catppuccin_status_right_separator ' '

set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_text ' #{?#{==:#W,zsh},#{b:pane_current_path},#W}'
set -g @catppuccin_window_current_text ' #{?#{==:#W,zsh},#{b:pane_current_path},#W}'

set -g @cpu_medium_thresh 40
set -g @cpu_high_thresh 80
set -g @ram_medium_thresh 60
set -g @ram_high_thresh 85
set -g @cpu_medium_fg_color "#{E:@thm_crust}"
set -g @cpu_medium_bg_color "#{E:@thm_yellow}"
set -g @ram_medium_fg_color "#{E:@thm_crust}"
set -g @ram_medium_bg_color "#{E:@thm_yellow}"

# The flavour lattice-theme has picked, as the plugin's own @thm_* colours. Set plainly here,
# they win over the plugin's flavour file, which only sets each one if it is unset. Switching
# re-sources this whole file (lattice-palette), since the plugin bakes the colours into the
# status formats as it loads. -q because there is no such file on macOS.
source-file -q ~/.cache/lattice/theme.tmux

run "$HOME/.local/share/tmux/plugins/tmux/catppuccin.tmux"

set -g status-position bottom
set -g status-justify left
set -g status-left-length 200
set -g status-right-length 200

set -g window-status-separator ' '

set -g status-left '#{E:@catppuccin_status_session}'

set -gF  status-right '#{@catppuccin_status_gitmux}'
set -agF status-right '#{E:@catppuccin_status_cpu}'
set -agF status-right '#{E:@catppuccin_status_ram}'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'tmux-plugins/tmux-cpu'

set -g @continuum-restore 'on'
set -g @continuum-boot 'off'
set -g @resurrect-capture-pane-contents 'on'

run "$HOME/.local/share/tmux/plugins/tpm/tpm"

set -g @catppuccin_gitmux_text ' #(o=$(gitmux -cfg $HOME/.gitmux.conf "#{pane_current_path}" 2>/dev/null); [ -n "$o" ] && echo "$o" || echo "no repo")'

set -gF  window-status-format "#[fg=#{@catppuccin_window_text_color},bg=default]"
set -agF window-status-format "#[fg=#{@thm_fg},bg=#{@catppuccin_window_text_color}]#{@catppuccin_window_text} "
set -agF window-status-format "#[fg=#{@thm_crust},bg=#{@catppuccin_window_number_color}] #{@catppuccin_window_number}"
set -agF window-status-format "#[fg=#{@catppuccin_window_number_color},bg=default]#[none]"

set -gF  window-status-current-format "#[fg=#{@catppuccin_window_current_text_color},bg=default]"
set -agF window-status-current-format "#[fg=#{@thm_fg},bg=#{@catppuccin_window_current_text_color}]#{@catppuccin_window_current_text} "
set -agF window-status-current-format "#[fg=#{@thm_crust},bg=#{@catppuccin_window_current_number_color}] #{@catppuccin_window_current_number}"
set -agF window-status-current-format "#[fg=#{@catppuccin_window_current_number_color},bg=default]#[none]"
