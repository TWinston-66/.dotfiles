# tmux for Ghostty on macOS, plugins from TPM, themed Gruvbox Material with the blue accent.

bind -N "Reload tmux config" r source-file "~/.config/tmux/tmux.conf" \; display "reloaded"

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:usstyle:extkeys:hyperlinks:sync:clipboard"

set -s escape-time 10
set -g mouse on
set -g history-limit 50000
set -g display-time 4000
set -g allow-passthrough all
set -g focus-events on
set -s extended-keys on
set -g extended-keys-format csi-u
setw -g aggressive-resize on
set -g status-interval 5

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g set-titles on
set -g set-titles-string "#S: #{b:pane_current_path}"

set -g set-clipboard on
# The mouse only selects; nothing is copied until it is asked for, with y, Enter or a right
# click, which then leave copy mode. A drag left alone stays selected, and a click clears it.
unbind -T copy-mode MouseDragEnd1Pane
bind -T copy-mode DoubleClick1Pane select-pane \; send -X select-word
bind -T copy-mode TripleClick1Pane select-pane \; send -X select-line
bind -T root DoubleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H ; send -X select-word }
bind -T root TripleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -H ; send -X select-line }
bind -T copy-mode y send -X copy-pipe-and-cancel
bind -T copy-mode Enter send -X copy-pipe-and-cancel
bind -T copy-mode MouseDown3Pane if -F "#{selection_present}" { send -X copy-pipe-and-cancel }
# Copy-mode scroll speed: 6 lines a wheel event. Ghostty scales the events it
# sends first (mouse-scroll-multiplier in its config).
bind -T copy-mode WheelUpPane select-pane \; send -X -N 6 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send -X -N 6 scroll-down

unbind %
unbind '"'
bind -N "Split side by side" '\' split-window -h -c "#{pane_current_path}"
bind -N "Split top and bottom" - split-window -v -c "#{pane_current_path}"
bind -N "New window" c new-window -c "#{pane_current_path}"

bind -N "Session picker (sesh)" o display-popup -h 60% -w 60% -E "sesh picker -i"

# Popups over the layout, in the pane's directory. The scratch shell is a session of its
# own, so what runs in it is still there the next time; the same key from inside closes it.
bind -N "Scratch shell popup (toggle)" ` if -F "#{==:#{session_name},scratch}" { detach-client } {
  display-popup -E -w 80% -h 75% -d "#{pane_current_path}" "env -u TMUX tmux new -A -s scratch \\; set -t scratch status off"
}
bind -N "lazygit popup" g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "zsh -ic lazygit"
bind -N "btop popup" t display-popup -E -w 90% -h 90% "zsh -ic btop"
set -g detach-on-destroy off

set-environment -g TMUX_FZF_LAUNCH_KEY "f"
set-environment -g TMUX_FZF_OPTIONS "-p -w 60% -h 60% -m"

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

### THEME: Gruvbox Material, blue accent ###

set -g @bg      "#282828"
set -g @bg_dark "#222222"
set -g @bg_dim  "#1b1b1b"
set -g @bg1     "#32302f"
set -g @bg3     "#45403d"
set -g @grey0   "#7c6f64"
set -g @grey2   "#a89984"
set -g @fg      "#d4be98"
set -g @red     "#ea6962"
set -g @yellow  "#d8a657"
set -g @green   "#a9b665"
set -g @aqua    "#89b482"
set -g @blue    "#7daea3"
set -g @purple  "#d3869b"

set -g status-style default
set -gF message-style "fg=#{@aqua},bg=default,align=centre"
set -gF message-command-style "fg=#{@aqua},bg=default,align=centre"
set -gF mode-style "bg=#{@bg1},bold"
set -gF popup-style "bg=#{@bg},fg=#{@fg}"
set -gF popup-border-style "fg=#{@bg3}"
set -gF menu-selected-style "fg=#{@fg},bg=#{@grey0},bold"
set -gF clock-mode-colour "#{@blue}"

set -gF pane-border-style "fg=#{@bg3}"
set -gF pane-active-border-style "##{?pane_synchronized,fg=#{@purple},fg=#{@blue}}"

# Panes without focus sit on a darker background, so the one being typed into stands out
# when a window is split. Programs that paint their own background keep it.
set -gF window-style "bg=#{@bg_dark}"
# terminal, not default: default in window-active-style inherits window-style, which made
# the focused pane dark too, a shade off the terminal's own background around it.
set -g window-active-style "bg=terminal"

set -g status-position bottom
set -g status-justify left
set -g status-left-length 200
set -g status-right-length 200

# Each status item is a pill: a rounded cap and an icon in its colour, then text on bg1.

# The session pill shows what the keys will do: red with the prefix down, yellow in copy
# mode, purple with the pane zoomed, green otherwise.
set -g @session_color "#{?client_prefix,#{@red},#{?pane_in_mode,#{@yellow},#{?window_zoomed_flag,#{@purple},#{@green}}}}"
set -g @session_icon "#{?client_prefix,󰌌 ,#{?pane_in_mode,󰆏 ,#{?window_zoomed_flag,󰁌 , }}}"
set -g status-left "#[fg=#{E:@session_color}]#[fg=#{@bg_dim},bg=#{E:@session_color}]#{E:@session_icon}#[fg=#{@fg},bg=#{@bg1}] #S#{?pane_in_mode, · copy,}#{?window_zoomed_flag, · zoom,}#[default] "

# Windows named after the shell show their directory instead.
set -g @window_name "#{?#{==:#W,zsh},#{b:pane_current_path},#W}"
set -g window-status-format "#[fg=#{@bg1}]#[fg=#{@fg},bg=#{@bg1}] #{E:@window_name} #[fg=#{@bg_dim},bg=#{@grey2}] #I#[fg=#{@grey2},bg=default]"
set -g window-status-current-format "#[fg=#{@bg3}]#[fg=#{@fg},bg=#{@bg3}] #{E:@window_name} #[fg=#{@bg_dim},bg=#{@purple}] #I#[fg=#{@purple},bg=default]"
set -g window-status-separator ' '
# tmux 3.8 underlines the current window by default; the colours above already mark it
set -g window-status-current-style default
set -gF window-status-activity-style "bg=#{@grey2},fg=#{@bg_dim}"
set -gF window-status-bell-style "bg=#{@yellow},fg=#{@bg_dim}"

# git (gitmux), then CPU and RAM from tmux-cpu, which fills in its #{cpu_*}/#{ram_*}
# when TPM loads it, so status-right is set before that.
set -g @gitmux '#(o=$(gitmux -cfg $HOME/.gitmux.conf "#{pane_current_path}" 2>/dev/null); [ -n "$o" ] && echo "$o" || echo "no repo")'
set -g  status-right "#[fg=#{@aqua}]#[fg=#{@bg_dim},bg=#{@aqua}]󰊢 #[fg=#{@fg},bg=#{@bg1}] #{E:@gitmux}#[default] "
set -ag status-right "#[fg=#{@yellow}]#[fg=#{@bg_dim},bg=#{@yellow}] #{cpu_fg_color}#{cpu_bg_color} #{cpu_percentage}#[default] "
set -ag status-right "#[fg=#{@yellow}]#[fg=#{@bg_dim},bg=#{@yellow}] #{ram_fg_color}#{ram_bg_color} #{ram_percentage}#[default] "

set -g @cpu_medium_thresh 40
set -g @cpu_high_thresh 80
set -g @ram_medium_thresh 60
set -g @ram_high_thresh 85
set -gF @cpu_low_fg_color    "#[fg=#{@fg}]"
set -gF @cpu_low_bg_color    "#[bg=#{@bg1}]"
set -gF @cpu_medium_fg_color "#[fg=#{@bg_dim}]"
set -gF @cpu_medium_bg_color "#[bg=#{@yellow}]"
set -gF @cpu_high_fg_color   "#[fg=#{@bg_dim}]"
set -gF @cpu_high_bg_color   "#[bg=#{@red}]"
set -gF @ram_low_fg_color    "#[fg=#{@fg}]"
set -gF @ram_low_bg_color    "#[bg=#{@bg1}]"
set -gF @ram_medium_fg_color "#[fg=#{@bg_dim}]"
set -gF @ram_medium_bg_color "#[bg=#{@yellow}]"
set -gF @ram_high_fg_color   "#[fg=#{@bg_dim}]"
set -gF @ram_high_bg_color   "#[bg=#{@red}]"

### PLUGINS ###

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'tmux-plugins/tmux-cpu'

set -g @continuum-restore 'on'
set -g @continuum-boot 'off'
set -g @resurrect-capture-pane-contents 'on'
# Sessions that die with their terminal window (.zshrc) are left out of every save.
set -g @resurrect-hook-post-save-layout "$HOME/.config/tmux/resurrect-drop.sh"

run "$HOME/.local/share/tmux/plugins/tpm/tpm"
