# The tray registers its icon once, with the StatusNotifierWatcher kded6 serves, and runs on
# without one if that isn't up yet, as at login. So it waits for the watcher, and restarts
# with kded6, whose restart drops the registration.
[Unit]
After=plasma-kded6.service
PartOf=plasma-kded6.service

[Service]
ExecStartPre=/bin/sh -c 'until busctl --user status org.kde.StatusNotifierWatcher >/dev/null 2>&1; do sleep 1; done'
Restart=on-failure
RestartSec=2
